[package]
name = "tree-sitter-plantuml"
description = "PlantUML grammar for tree-sitter"
version = "0.0.1"
authors = ["qFioofa <penavana1@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "plantuml"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/qFioofa/tree-sitter-plantuml"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["/LICENSE", "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.4"
