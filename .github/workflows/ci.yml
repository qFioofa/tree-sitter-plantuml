name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tree-sitter generate
      - run: git diff --exit-code src/
      - run: npm run lint
      - run: npm test
      - name: Compile queries
        run: |
          for q in queries/*.scm; do
            npx tree-sitter query "$q" test/fixtures/class_features.puml > /dev/null
          done
